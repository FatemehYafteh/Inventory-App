# Adds the demo data to the production database (Atlas), from GitHub's servers.
# Run it from the Actions tab: "Seed demo data" > Run workflow.
# Needs the repository secrets MONGODB_URI and SEED_PASSWORD (Settings > Secrets and variables >
# Actions). SEED_PASSWORD is the password of the seeded accounts: at least 12 characters and NOT
# the default one from the README, because this repository is public and the seed creates an
# admin account. The seed itself also refuses the default password for a database that is not
# on the machine running it.
# Only adds what is missing, like `npm run seed -w server`: existing users and data are kept.
name: Seed demo data

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SEED to add the demo accounts and data to the production database'
        required: true

permissions:
  contents: read

concurrency:
  group: seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the confirmation
        if: ${{ inputs.confirm != 'SEED' }}
        run: |
          echo "Type SEED in the confirm field to run this workflow."
          exit 1

      - name: Check that SEED_PASSWORD is set
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: |
          if [ -z "$SEED_PASSWORD" ]; then
            echo "Add the repository secret SEED_PASSWORD (a long, private password) first."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install server dependencies
        run: npm ci --omit=dev

      - name: Seed
        working-directory: server
        run: node scripts/seed.js
        env:
          NODE_ENV: development
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          # The seed never signs tokens or builds links; loadConfig only needs valid values.
          JWT_ACCESS_SECRET: seed-only-placeholder-not-used-anywhere-000
          JWT_REFRESH_SECRET: seed-only-placeholder-not-used-anywhere-111
          CLIENT_ORIGIN: https://inventory-app-drab-tau.vercel.app
          APP_URL: https://inventory-app-drab-tau.vercel.app
