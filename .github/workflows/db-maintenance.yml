# One-off tasks on the production database (Atlas), from GitHub's servers.
# Run it from the Actions tab: "Database maintenance" > Run workflow, pick the task and type RUN.
# Needs the repository secret MONGODB_URI.
#   migrate-initial-reason: old "Initial stock" movement notes become reason=initial (safe to rerun)
#   sync-indexes: indexes match the schemas; drops the single-field product indexes replaced in #96
name: Database maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        type: choice
        options:
          - migrate-initial-reason
          - sync-indexes
      confirm:
        description: 'Type RUN to run it on the production database'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seed
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the confirmation
        if: ${{ inputs.confirm != 'RUN' }}
        run: |
          echo "Type RUN in the confirm field to run this workflow."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install server dependencies
        run: npm ci --omit=dev

      - name: Run ${{ inputs.task }}
        working-directory: server
        run: node scripts/db-maintenance.js "${{ inputs.task }}"
        env:
          NODE_ENV: development
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # The task never signs tokens or builds links; loadConfig only needs valid values.
          JWT_ACCESS_SECRET: maintenance-only-placeholder-not-used-000000
          JWT_REFRESH_SECRET: maintenance-only-placeholder-not-used-111111
          CLIENT_ORIGIN: https://inventory-app-drab-tau.vercel.app
          APP_URL: https://inventory-app-drab-tau.vercel.app
