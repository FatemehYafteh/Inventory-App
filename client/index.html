<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Email links carry one-time tokens in the URL; never leak them in Referer. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <!-- Light value for the first paint; the script below and theme.js keep it in step. -->
    <meta name="theme-color" content="#F8FAFC" />
    <!-- Sets the theme before the first paint so dark users never see a light flash.
         Keep in step with applyTheme() in src/theme/theme.js. -->
    <script>
      (function () {
        try {
          var saved = null;
          try {
            saved = window.localStorage.getItem('theme');
          } catch (e) {}
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0B1220' : '#F8FAFC');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Anbar</title>
    <meta
      name="description"
      content="Accurate stock counts and a full history of every change. Sign in with Telegram. English and Persian."
    />
    <!-- Link preview (LinkedIn, Telegram and others). Crawlers do not run scripts, so these are
         static and use absolute URLs; og:image is client/public/og-image.png (1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anbar" />
    <meta property="og:title" content="Anbar: inventory management" />
    <meta
      property="og:description"
      content="Accurate stock counts and a full history of every change. Sign in with Telegram. English and Persian."
    />
    <meta property="og:url" content="https://inventory-app-drab-tau.vercel.app/" />
    <meta property="og:image" content="https://inventory-app-drab-tau.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Anbar: inventory management" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
